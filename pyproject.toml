[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-watch"
version = "1.0.3"
description = "Standard logging, asynchronous notifications and secure application commands"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Sergey Fundobny", email = "silverbull@mail.ru"}]
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2", "cryptography>=43"]
telegram = ["aiohttp>=3.14.3,<4"]
ntfy = ["aiohttp>=3.14.3,<4"]
gateway = ["aiohttp>=3.14.3,<4"]
commands = ["aiohttp>=3.14.3,<4"]
service = ["pywin32>=306; sys_platform == 'win32'"]
tray = ["pystray>=0.19.5,<1; sys_platform == 'win32'", "Pillow>=10,<13; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remote_watch = ["py.typed", "gateway_server/templates/*"]

[tool.setuptools.data-files]
"share/remote-watch/logo" = ["logo/remote_watch.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = ["integration: explicitly enabled live-provider tests"]

[tool.ruff]
target-version = "py310"
line-length = 115

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "E501"]
