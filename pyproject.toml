[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-watch"
version = "0.2.0.dev3"
description = "Standard logging integration and bounded asynchronous remote notifications"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Sergey Fundobny", email = "silverbull@mail.ru"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Private :: Do Not Upload",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]
telegram = ["aiohttp>=3.14.3,<4"]
ntfy = ["aiohttp>=3.14.3,<4"]
relay = ["aiohttp>=3.14.3,<4"]
gateway = ["aiohttp>=3.14.3,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remote_watch = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = ["integration: explicitly enabled live-provider tests"]

[tool.ruff]
target-version = "py310"
line-length = 115

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
