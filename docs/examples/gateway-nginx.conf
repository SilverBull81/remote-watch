# Пример отдельного nginx перед gateway на той же машине. Пути и имя заменяются при размещении.
worker_processes 1;
error_log /var/log/nginx/gateway-error.log crit;
events { worker_connections 128; }

http {
    access_log off;
    limit_conn_zone $binary_remote_addr zone=per_ip:1m;
    limit_conn_zone $server_name zone=all_clients:1m;
    limit_req_zone $binary_remote_addr zone=request_rate:1m rate=5r/s;

    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 15s;
    keepalive_timeout 2s;
    keepalive_requests 20;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;
    client_max_body_size 64k;
    client_body_buffer_size 64k;

    server {
        listen 443 ssl;
        server_name gateway.example.com;
        ssl_certificate /etc/remote-watch/fullchain.pem;
        ssl_certificate_key /etc/remote-watch/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        limit_conn all_clients 64;
        limit_conn per_ip 8;
        limit_conn_status 429;
        limit_req zone=request_rate burst=10 nodelay;
        limit_req_status 429;

        location = /v1/notifications {
            if ($request_method != POST) { return 405; }
            proxy_pass http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 12s;
            proxy_next_upstream off;
            proxy_request_buffering on;
            proxy_buffering on;
        }
        location / { return 404; }
    }
}
