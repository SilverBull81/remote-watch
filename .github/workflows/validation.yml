name: Package validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.12']
        mode: [core, extras]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build ruff
      - run: python -m ruff check .
      - run: python tools/validate.py --mode ${{ matrix.mode }} --output build/ci-validation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.mode }}
          path: |
            build/ci-validation/report.json
            build/ci-validation/tests.xml
            build/ci-validation/*.log
          retention-days: 7
